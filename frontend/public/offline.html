<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — FormSaathi</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #070d1f; color: #e2e8f0; font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      padding: 24px; text-align: center;
    }
    .card { max-width: 26rem; }
    img { width: 72px; height: 72px; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; color: #fff; margin-bottom: 10px; }
    p { font-size: 0.9rem; color: #94a3b8; line-height: 1.6; }
    button {
      margin-top: 22px; background: #14b8a6; color: #fff; border: 0; cursor: pointer;
      font-weight: 600; font-size: 0.9rem; padding: 12px 26px; border-radius: 12px;
    }
    button:hover { background: #0d9488; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="FormSaathi" width="72" height="72" />
    <h1>You're offline</h1>
    <p>FormSaathi can't reach the internet right now. Your saved listings and tracker stay on this device — reconnect to search, sync and get notifications.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
